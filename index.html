<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma ADS</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <header class="Data">
        <div id="periodoData" class="data-label">HOJE</div>
        <h1 id="InforData">29/09/26</h1>
        <div id="diaSemana" class="dia-semana">Terça-feira</div>
    </header>

    <main class="area-cronograma">
        <div class="controle-dia controle-anterior">
            <p id="Aulas_Ontem_Texto">Aulas anteriores</p>
            <button id="botaoAnterior" class="botao-navegacao" type="button" aria-label="Ver aulas anteriores">‹</button>
        </div>

        <section class="MenuPrincipal">
            <div class="Conteudo">
                <div class="cabecalho-conteudo">
                    <span id="tituloDia">Aulas de hoje</span>
                    <span id="contadorAulas" class="contador-aulas">0 aulas</span>
                </div>
                
                <button id="botaoHoje" class="botao-hoje" hidden>Voltar para Hoje</button>

                <div id="listaAulas" class="lista-aulas"></div>

                <div id="mensagemFinal" class="mensagem-final" hidden>
                    Aproveite o restante do dia!
                </div>

                <div id="semAulas" class="sem-aulas" hidden>
                    <div class="sem-aulas-icone">✓</div>
                    <strong>acabou azaula</strong>
                    <span>Aproveite o restante do dia.</span>
                </div>
            </div>
        </section>

        <div class="controle-dia controle-proximo">
            <p id="Aulas_Amanha_Texto">Próximas aulas</p>
            <button id="botaoProximo" class="botao-navegacao" type="button" aria-label="Ver próximas aulas">›</button>
        </div>
    </main>

    <script src="script.js?=v=3"></script>
</body>
</html>
